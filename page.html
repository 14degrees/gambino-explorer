    <!-- Google tag (gtag.js) -->
    <script>
      const gaId =
        location.host === "local.gambinoslot.com" ||
        location.host === "stage.gambinoslot.com"
          ? "G-SCY995PNPT"
          : "G-6SL4G56WDV";
      var gam = gam || {};
      gam.pageloadTs = Date.now();
      let gaScript = document.createElement("script");
      gaScript.async = true;
      gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
      document.head.appendChild(gaScript);

      gam.gaConf = {};
      if (gaId === "G-SCY995PNPT") gam.gaConf.debug_mode = true;
      gam.userId = JSON.parse(localStorage.getItem("externalUserId"));
      if (gam.userId) gam.gaConf.user_id = gam.userId;
      gam.sessData = localStorage.getItem("gam-source");
      if (gam.sessData) {
        gam.sessData = JSON.parse(gam.sessData);
        gam.lastActivity = localStorage.getItem("gam-last-activity");
        gam.isNewSession =
          !gam.lastActivity ||
          new Date().getTime() - parseInt(gam.lastActivity, 10) >
            30 * 60 * 1000;
      }
      if (gam.sessData && gam.sessData.pageType && !gam.isNewSession) {
        gam.gaConf.landing_page_type = gam.sessData.pageType;
        gam.gaConf.landing_was_player = gam.sessData.sessionWasPlayer;
      } else {
        // new
        gam.gaConf.landing_page_type = window.location.search?.includes(
          "cid=gbclid"
        )
          ? "H5 with Tracking"
          : "H5";
        gam.gaConf.landing_was_player = gam.userId ? 1 : 0;
      }

      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag.sessionData = gam.sessData ? gam.sessData : {};
      gtag("js", new Date());
      gtag("config", gaId, gam.gaConf);
      if (location.pathname.startsWith("/free_fun_games.")) {
        gam.lastTimingTs = Date.now();
        gtag("event", "load_h5_pageview", {
          h5_view: 1,
          load_timing: 1,
          load_timing_norm: 1,
          loading_phase: "h5_pageview",
          load_timing_delta: 1,
          value: 1,
        });
      }
    </script>

      // btn.onclick = function () {
      //  modal.style.display = "block";
      // };
      // When receive bookmark event, open the modal
      window.onmessage = function (e) {
        if (e.data == "addBookmarkClicked") {
          modal.style.display = "block";
        }

        if (e.data == "addShortcutkClicked") {
          addShortcutModal.classList.remove("hide");
        }

        if (typeof window[e.data.func] == "function") {
          window[e.data.func].call(null, e.data.params);
        }
      };
      popupBtn.onclick = function () {
        modal.style.display = "none";
      };
      // When the user clicks anywhere outside of the modal, close it
      window.onclick = function (event) {
        if (event.target == modal) {
          modal.style.display = "none";
        }
      };

      if (window.addEventListener) {
        window.addEventListener("message", onMessage, false);
      } else if (window.attachEvent) {
        window.attachEvent("onmessage", onMessage, false);
      }

      function onMessage(event) {
        // Check sender origin to be trusted
        if (event.origin !== "http://example.com") return;

        var data = event.data;

        if (typeof window[data.func] == "function") {
          window[data.func].call(null, data.message);
        }
      }
    </script>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const modalCloseBtn = document.querySelectorAll(".modal__close__btn");
        const navigator = window.navigator;
        const body = document.querySelector(".body");
        const buttonGetCoins = document.querySelectorAll(".modal__button");

        const spiralToken = JSON.parse(
          localStorage.getItem("gambino_spiral_token")
        );

        const iframe = document.getElementById("advanced_iframe");
        iframe.onload = function () {
          iframe.contentWindow.postMessage(
            { event: "setSpiralToken", value: spiralToken },
            "*"
          );
        };

        function hexToDec(hex) {
          return parseInt(hex, 16);
        }

        const checkSpiralToken = hexToDec(spiralToken);

        const popupConfig = [{ id: "0" }, { id: "1" }, { id: "2" }];
        const initialList = popupConfig.map((item) => item.id);

        const clickedPopups =
          JSON.parse(localStorage.getItem("clickedPopups")) || [];

        const finalList = initialList.filter(
          (n) => clickedPopups.indexOf(n) === -1
        );
        const finalItems = finalList.length;

        const numberOfModal = +finalList[0];

        function showModal() {
          const lastVisit = localStorage.getItem("numberOfModal");
          if (lastVisit) {
            if (lastVisit !== numberOfModal) {
              //to do sent event to tracking server
              let testGroup = checkSpiralToken % 2 === 0;
              const addEvent = async (name, value = {}) => {
                let url = new URL("https://www.gambinoslot.com/api/events/");
                url.searchParams.append("spiralToken", spiralToken);
                url.searchParams.append("name", "show_popup");
                url.searchParams.append(
                  "value",
                  JSON.stringify({
                    id: numberOfModal,
                    clickedPopups: clickedPopups,
                    testGroup: testGroup,
                  })
                );
                url.searchParams.append("time", new Date().toLocaleString());
                const response = await fetch(url, {
                  mode: "no-cors",
                });
                const data = await response;

                return data;
              };
              if (testGroup) {
                addEvent("show_popup");
                return;
              }
              addEvent("show_popup");
              openModal(numberOfModal);
              localStorage.setItem("numberOfModal", numberOfModal);
            } else {
              localStorage.setItem("numberOfModal", numberOfModal + 1);
            }
          } else {
            localStorage.setItem("numberOfModal", numberOfModal);
          }
        }

        function showModalOnceADay() {
          const today = new Date().toISOString().split("T")[0]; // Format: 'YYYY-MM-DD'

          const lastShown = localStorage.getItem("modalLastShown");

          if (!lastShown) {
            showModal();
            localStorage.setItem("modalLastShown", today);
          }

          if (lastShown !== today) {
            showModal();

            localStorage.setItem("modalLastShown", today);
          }
        }

        function openModal(n) {
          if (
            /Mobile|iP(hone|od|ad)|Android|BlackBerry|BB|IEMobile|Kindle|NetFront|Silk-Accelerated|(hpw|web)OS|Fennec|Minimo|Opera M(obi|ini)|Blazer|Dolfin|Dolphin|Skyfire|Zune/gi.test(
              navigator.userAgent
            )
          ) {
            console.log("mobile");
            document.getElementById(`${n}`).classList.remove("show");
            document.getElementById(`${n}`).classList.add("hide");
            document.body.style.overflow = "visible";
          } else {
            console.log("desktop");
            console.log(document.getElementById(`${n}`));
            document.getElementById(`${n}`).classList.add("show");
            document.getElementById(`${n}`).classList.remove("hide");
            document.body.style.overflow = "hidden";
          }
        }

        modalCloseBtn.forEach((button) => {
          button.addEventListener("click", function (event) {
            document
              .getElementById(`${numberOfModal}`)
              .classList.remove("show");
            document.getElementById(`${numberOfModal}`).classList.add("hide");
            document.body.style.overflow = "";
            body.removeEventListener("mouseleave", openModal);
          });
        });

        buttonGetCoins.forEach((button) => {
          button.addEventListener("click", function (event) {
            const numberOfLink = event.target.id.slice(4);
            clickedPopups.push(numberOfLink);
            localStorage.setItem(
              "clickedPopups",
              JSON.stringify(clickedPopups)
            );
          });
        });

        // document
        //   .getElementById(`${numberOfModal}`)
        //   .addEventListener("click", (e) => {
        //     if (e.target === document.getElementById(`${numberOfModal}`)) {
        //       document
        //         .getElementById(`${numberOfModal}`)
        //         .classList.remove("show");
        //       document.getElementById(`${numberOfModal}`).classList.add("hide");
        //       document.body.style.overflow = "";
        //       body.removeEventListener("mouseleave", openModal);
        //     }
        //   });

        document.addEventListener("keydown", (e) => {
          if (
            e.code === "Escape" &&
            document
              .getElementById(`${numberOfModal}`)
              .classList.contains("show")
          ) {
            document
              .getElementById(`${numberOfModal}`)
              .classList.remove("show");
            document.getElementById(`${numberOfModal}`).classList.add("hide");
            document.body.style.overflow = "";
            body.removeEventListener("mouseleave", openModal);
          }
        });
      });
